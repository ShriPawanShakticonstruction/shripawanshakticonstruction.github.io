<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apply — Shri Pawan Shakti Construction</title>
<style>
:root{--gold:#c9a55a;--cream:#f7f3eb;--ink:#171717;--line:#e6dece}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:var(--ink)}.wrap{max-width:900px;margin:30px auto;padding:20px}.head{text-align:center;margin-bottom:20px}.head img{width:92px;height:92px;border-radius:18px;object-fit:cover;box-shadow:0 8px 24px rgba(0,0,0,.08)}.head h1{margin:14px 0 6px;font-size:2rem}.head p{margin:0;color:#555}.tabs{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}.tab{background:#fff;border:1px solid var(--line);padding:12px 18px;border-radius:999px;cursor:pointer;font-weight:700;color:var(--ink)}.tab.active{background:var(--gold);color:#fff;border-color:var(--gold)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,.04)}.form{display:none}.form.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid>div{display:flex;flex-direction:column}.label{font-weight:700;margin-bottom:8px}.input,select,textarea{width:100%;padding:12px 14px;border:1px solid #d8d1c4;border-radius:10px;font-size:1rem;background:#fff}textarea{min-height:120px;resize:vertical}.resumeSection{border:1px dashed #cbbf9a;border-radius:12px;padding:14px;background:#faf7f1}.uploadHint{margin-top:8px;color:#666;font-size:.9rem}.submitBtn{margin-top:18px;width:100%;border:none;border-radius:12px;padding:15px 18px;background:linear-gradient(135deg,#c9a55a,#b38b3d);color:#fff;font-weight:700;font-size:1rem;cursor:pointer}.back{display:inline-block;margin-top:18px;color:#5f4a18;font-weight:700}@media (max-width:640px){.grid{grid-template-columns:1fr}.wrap{padding:12px}.head h1{font-size:1.5rem}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <img src="assets/IMG-20260927-WA7171.jpg" alt="Company Logo">
    <h1>Shri Pawan Shakti Construction</h1>
    <p>Construction work और job के लिए आवेदन करें</p>
  </div>
  
  <div class="tabs">
    <button class="tab active" data-tab="work">🏗️ Apply for Work</button>
    <button class="tab" data-tab="job">💼 Apply for Job</button>
  </div>
  
  <div class="card">
    <!-- APPLY FOR WORK FORM - FIXED -->
    <form action="https://formsubmit.co/shripawanshakticonstruction@gmail.com" method="POST" enctype="multipart/form-data" class="form active" data-form="work">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_subject" value="New Work Enquiry - Pawan Shakti">
      <input type="hidden" name="_next" value="https://shripawanshakticonstruction.github.io/thankyou.html">
      
      <h2>Apply for Work</h2>
      <div class="grid">
        <div><label class="label">पूरा नाम *</label><input name="Name" required class="input"></div>
        <div><label class="label">मोबाइल नंबर *</label><input name="Phone" type="tel" required class="input"></div>
        <div><label class="label">Email</label><input name="Email" type="email" class="input"></div>
        <div><label class="label">काम का प्रकार *</label>
          <select name="WorkType" required class="input">
            <option value="">-- चुनें --</option><option>Road Construction</option><option>Electrical Work</option><option>Building Construction</option><option>Civil Work</option><option>Government Tender</option><option>Other</option>
          </select>
        </div>
        <div style="grid-column:1/-1;"><label class="label">विवरण / बजट *</label><textarea name="Details" required class="input"></textarea></div>
        <div style="grid-column:1/-1;">
          <div class="resumeSection">
            <label class="label">📄 Company Documents (Optional)</label>
            <input type="file" name="attachment" class="input" accept=".pdf,.doc,.docx,.jpg,.png">
            <div class="uploadHint">PDF, DOC, JPG, PNG - Max 5MB</div>
          </div>
        </div>
        <div style="grid-column:1/-1;"><button class="submitBtn" type="submit">📤 Apply for Work</button></div>
      </div>
    </form>

    <!-- APPLY FOR JOB FORM - FIXED -->
    <form action="https://formsubmit.co/shripawanshakticonstruction@gmail.com" method="POST" enctype="multipart/form-data" class="form" data-form="job">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_subject" value="New Job Application - Pawan Shakti">
      <input type="hidden" name="_next" value="https://shripawanshakticonstruction.github.io/thankyou.html">
      
      <h2>Apply for Job</h2>
      <div class="grid">
        <div><label class="label">पूरा नाम *</label><input name="Name" required class="input"></div>
        <div><label class="label">मोबाइल नंबर *</label><input name="Phone" type="tel" required class="input"></div>
        <div><label class="label">Email *</label><input name="Email" type="email" required class="input"></div>
        <div><label class="label">पद *</label>
          <select name="Position" required class="input">
            <option value="">-- चुनें --</option><option>Site Engineer</option><option>Foreman</option><option>Skilled Labor</option><option>Driver</option><option>Other</option>
          </select>
        </div>
        <div><label class="label">अनुभव *</label><input name="Experience" type="number" required class="input"></div>
        <div><label class="label">योग्यता *</label>
          <select name="Qualification" required class="input">
            <option value="">-- चुनें --</option><option>10th Pass</option><option>12th Pass</option><option>Diploma</option><option>Graduate</option>
          </select>
        </div>
        <div style="grid-column:1/-1;"><label class="label">आपके बारे में *</label><textarea name="About" required class="input"></textarea></div>
        <div style="grid-column:1/-1;">
          <div class="resumeSection">
            <label class="label">📄 Resume/CV *</label>
            <input type="file" name="attachment" class="input" accept=".pdf,.doc,.docx" required>
            <div class="uploadHint">PDF / DOC - Max 5MB</div>
          </div>
        </div>
        <div style="grid-column:1/-1;"><button class="submitBtn" type="submit">📤 Apply for Job</button></div>
      </div>
    </form>
  </div>
  <a class="back" href="index.html">← मुख्य वेबसाइट पर वापस जाएँ</a>
</div>

<script>
const tabs=document.querySelectorAll('.tab');
const forms=document.querySelectorAll('.form');
tabs.forEach(tab=>{
  tab.addEventListener('click',()=>{
    tabs.forEach(x=>x.classList.remove('active'));
    forms.forEach(x=>x.classList.remove('active'));
    tab.classList.add('active');
    document.querySelector(`.form[data-form="${tab.dataset.tab}"]`).classList.add('active');
  });
});
</script>
</body>
              </html>
