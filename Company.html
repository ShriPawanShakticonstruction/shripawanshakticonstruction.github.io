<!DOCTYPE html>
<html>
<head>
  <title>Company Information - Shri Pawan Shakti Construction</title>
  <link rel="stylesheet" href="service-pages.css">
</head>
<body>
  <header><h1>Shri Pawan Shakti Construction</h1></header>
  <section style="padding:40px; max-width:800px; margin:auto;">
    <h2>About Our Company</h2>
    <div id="company-info">
      <!-- Ye data admin se ayega -->
      <p>Loading...</p>
    </div>
    <div style="margin-top:20px; background:#f5f5f5; padding:15px;">
      <p><strong>GSTIN:</strong> <span id="gst">23XXXXXXXXXXXXXXX</span></p>
      <p><strong>Address:</strong> Dabra, Gwalior, MP</p>
    </div>
  </section>
  <script src="service-pages.js"></script>
  <script>
    fetch('/assets/company.json')
      .then(r=>r.json())
      .then(data=>{
        document.getElementById('company-info').innerHTML = data.body;
        document.getElementById('gst').innerText = data.gstin;
      });
  </script>
</body>
</html>
